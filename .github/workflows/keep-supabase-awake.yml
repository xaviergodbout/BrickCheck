name: Keep Supabase awake

on:
  schedule:
    # Three small database requests daily, at off-peak minutes (UTC).
    - cron: '23 5,13,21 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Supabase database
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo 'Add SUPABASE_URL and SUPABASE_ANON_KEY in repository Actions secrets.'
            exit 1
          fi

          # RLS hides account rows from this anonymous read. Discard the response
          # rather than logging it. The apikey header supports publishable and
          # legacy anon keys without treating a publishable key as a user JWT.
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 10 --retry-max-time 100 \
            --output /dev/null \
            --header "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/brickcheck_accounts?select=user_id&limit=1"

          echo 'Supabase database check succeeded.'
